<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⚽ Wett Prediction Tool</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    .prediction-card { transition: all 0.3s ease; }
    .prediction-card:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
    .win-prob { background: linear-gradient(135deg, #3b82f6 0%, #60a5fa 100%); }
    .over-prob { background: linear-gradient(135deg, #10b981 0%, #34d399 100%); }
    .strong { color: #059669; font-weight: bold; }
  </style>
</head>
<body class="bg-gradient-to-br from-blue-50 to-blue-100 min-h-screen">

  <!-- HEADER -->
  <header class="bg-white shadow-lg">
    <div class="max-w-7xl mx-auto px-4 py-6">
      <div class="flex items-center justify-between">
        <div>
          <h1 class="text-3xl font-bold text-blue-600">⚽ WETT PREDICTION</h1>
          <p class="text-gray-600 text-sm">Real-time Spielprognosen & Quoten</p>
        </div>
        <div class="text-right">
          <p class="text-sm text-gray-600" id="status">Lädt Daten...</p>
          <p class="text-xs text-gray-500" id="last-update"></p>
        </div>
      </div>
    </div>
  </header>

  <!-- FILTER BUTTONS -->
  <div class="max-w-7xl mx-auto px-4 py-6">
    <div class="bg-white rounded-lg shadow p-4 mb-6">
      <p class="text-sm font-semibold text-gray-700 mb-3">Liga Filter:</p>
      <div class="flex gap-3 flex-wrap">
        <button onclick="filterMatches('ALL')" class="px-6 py-2 rounded-lg bg-blue-600 text-white font-semibold hover:bg-blue-700 transition">
          Alle Spiele
        </button>
        <button onclick="filterMatches('PL')" class="px-6 py-2 rounded-lg bg-gray-200 text-gray-800 font-semibold hover:bg-gray-300 transition">
          Premier League
        </button>
        <button onclick="filterMatches('BL1')" class="px-6 py-2 rounded-lg bg-gray-200 text-gray-800 font-semibold hover:bg-gray-300 transition">
          Bundesliga
        </button>
      </div>
    </div>
  </div>

  <!-- MATCHES CONTAINER -->
  <div class="max-w-7xl mx-auto px-4 pb-12">
    <div id="matches-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <div class="col-span-full text-center py-12">
        <p class="text-gray-500 text-lg">⏳ Lädt Vorhersagen...</p>
      </div>
    </div>
  </div>

  <!-- FOOTER -->
  <footer class="bg-white border-t border-gray-200 py-6 mt-12">
    <div class="max-w-7xl mx-auto px-4 text-center text-gray-600 text-sm">
      <p>Datenquellen: Football-data.org | Predictions: ELO-based Algorithm</p>
      <p class="mt-2 text-xs text-gray-500">© 2026 Wett Prediction Tool | Oktober 2026 Live</p>
    </div>
  </footer>

  <script>
    let allMatches = [];
    let currentFilter = 'ALL';

    // Transform API response to match dashboard structure
    function transformPredictions(predictions) {
      return predictions.map(p => ({
        ...p,
        win_probability: {
          homeWinProb: (p.home_win_prob * 100).toFixed(1),
          drawProb: (p.draw_prob * 100).toFixed(1),
          awayWinProb: (p.away_win_prob * 100).toFixed(1)
        },
        over_under_2_5: {
          overProb: (p.over_2_5_prob * 100).toFixed(1),
          underProb: (p.under_2_5_prob * 100).toFixed(1),
          expectedTotalGoals: ((p.over_2_5_prob + p.under_2_5_prob) / 2 * 3).toFixed(1)
        }
      }));
    }
    
    // Fetch Predictions
    async function loadPredictions() {
      try {
        const response = await fetch('/api/predictions/all');
        const data = await response.json();
        
     if (data.success) {
          allMatches = transformPredictions(data.predictions || []);
          document.getElementById('status').textContent = `✓ ${allMatches.length} Spiele geladen`;
          document.getElementById('last-update').textContent = new Date().toLocaleTimeString('de-DE');
          renderMatches();
        } else {
          document.getElementById('status').textContent = '✗ Fehler beim Laden';
        }
      } catch (error) {
        console.error('Fehler:', error);
        document.getElementById('status').textContent = '✗ Verbindungsfehler';
      }
    }

    // Filter Matches
    function filterMatches(league) {
      currentFilter = league;
      
      // Update button styles
      document.querySelectorAll('button').forEach(btn => {
        btn.classList.remove('bg-blue-600', 'text-white');
        btn.classList.add('bg-gray-200', 'text-gray-800');
      });
      event.target.classList.add('bg-blue-600', 'text-white');
      event.target.classList.remove('bg-gray-200', 'text-gray-800');
      
      renderMatches();
    }

    // Render Matches
    function renderMatches() {
      const container = document.getElementById('matches-container');
      const filtered = currentFilter === 'ALL' 
        ? allMatches 
        : allMatches.filter(m => m.competition === currentFilter);

      if (filtered.length === 0) {
        container.innerHTML = '<div class="col-span-full text-center py-12"><p class="text-gray-500">Keine Spiele für diese Liga</p></div>';
        return;
      }

      container.innerHTML = filtered.map(match => `
  <div class="prediction-card bg-white rounded-lg shadow-md overflow-hidden border-l-4 border-blue-500 hover:shadow-xl">
    
    <!-- MATCH HEADER -->
    <div class="bg-gradient-to-r from-blue-500 to-blue-600 text-white p-4">
      <div class="flex justify-between items-start mb-2">
        <span class="text-xs font-semibold bg-blue-700 px-2 py-1 rounded">${match.competition}</span>
        <span class="text-xs text-blue-100">${new Date(match.kick_off).toLocaleDateString('de-DE')}</span>
      </div>
      <p class="text-xs text-blue-100">
        ${new Date(match.kick_off).toLocaleTimeString('de-DE', {hour: '2-digit', minute:'2-digit'})} Uhr
      </p>
    </div>

    <!-- MATCH TEAMS -->
    <div class="p-4 border-b border-gray-200">
      <div class="text-center">
        <p class="text-lg font-bold text-gray-800 mb-2">${match.home_team}</p>
        <p class="text-sm text-gray-600 mb-2">vs</p>
        <p class="text-lg font-bold text-gray-800">${match.away_team}</p>
      </div>
    </div>

    <!-- STATUS -->
    <div class="px-4 pt-2">
      <span class="text-xs font-semibold ${match.status === 'FINISHED' ? 'text-red-600' : 'text-green-600'}">
        ${match.status === 'FINISHED' ? '✓ BEENDET' : '⏳ ANSTEHEND'}
      </span>
    </div>

    <!-- WIN PROBABILITY -->
    <div class="p-4 border-b border-gray-200">
      <p class="text-xs font-semibold text-gray-600 mb-3">🎯 GEWINNCHANCE</p>
      <div class="space-y-2">
        <div class="flex justify-between items-center">
          <span class="text-sm font-semibold text-gray-700">${match.home_team}</span>
          <span class="text-sm font-bold text-blue-600">${match.win_probability.homeWinProb}%</span>
        </div>
        <div class="w-full bg-gray-200 rounded-full h-2">
          <div class="bg-blue-500 h-2 rounded-full" style="width: ${match.win_probability.homeWinProb}%"></div>
        </div>
        
        <div class="flex justify-between items-center mt-3">
          <span class="text-sm font-semibold text-gray-700">UNENTSCHIEDEN</span>
          <span class="text-sm font-bold text-gray-600">${match.win_probability.drawProb}%</span>
        </div>
        <div class="w-full bg-gray-200 rounded-full h-2">
          <div class="bg-gray-400 h-2 rounded-full" style="width: ${match.win_probability.drawProb}%"></div>
        </div>
        
        <div class="flex justify-between items-center mt-3">
          <span class="text-sm font-semibold text-gray-700">${match.away_team}</span>
          <span class="text-sm font-bold text-red-600">${match.win_probability.awayWinProb}%</span>
        </div>
        <div class="w-full bg-gray-200 rounded-full h-2">
          <div class="bg-red-400 h-2 rounded-full" style="width: ${match.win_probability.awayWinProb}%"></div>
        </div>
      </div>
    </div>

    <!-- OVER/UNDER -->
    <div class="p-4">
      <p class="text-xs font-semibold text-gray-600 mb-3">📊 ÜBER/UNTER 2.5 TORE</p>
      <div class="grid grid-cols-2 gap-3">
        <div class="bg-green-50 rounded p-3 text-center">
          <p class="text-xs text-gray-600">OVER</p>
          <p class="text-lg font-bold text-green-600">${match.over_under_2_5.overProb}%</p>
        </div>
        <div class="bg-red-50 rounded p-3 text-center">
          <p class="text-xs text-gray-600">UNDER</p>
          <p class="text-lg font-bold text-red-600">${match.over_under_2_5.underProb}%</p>
        </div>
      </div>
      <p class="text-xs text-gray-500 mt-2 text-center">
        Erw. Tore: ${match.over_under_2_5.expectedTotalGoals}
      </p>
    </div>

  </div>
`).join('');
    }

    // Load on page load
    document.addEventListener('DOMContentLoaded', loadPredictions);
    
    // Auto-refresh every 5 minutes
    setInterval(loadPredictions, 5 * 60 * 1000);
  </script>

</body>
</html>
